<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>パブスポ専用 チーム分けツール</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg-main: #050608;
      --bg-card: #111318;
      --bg-input: #191c22;
      --gold: #ffd86b;
      --gold-strong: #f5b300;
      --accent: #4adeff;
      --text-main: #f5f5f5;
      --text-muted: #a5acba;
      --border-subtle: #272b33;
    }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 18px 14px 26px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Helvetica Neue", "Segoe UI", sans-serif;
      line-height: 1.6;
      background:
        radial-gradient(circle at top, #252b3b 0, #050608 55%),
        radial-gradient(circle at bottom, #111827 0, #050608 55%);
      color: var(--text-main);
    }

    .app-shell {
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.32rem;
      margin: 0;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(120deg, #fff6d4, var(--gold-strong));
      -webkit-background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .card {
      background: radial-gradient(circle at top left, #161926, #070910);
      border-radius: 22px;
      border: 1px solid rgba(148,163,184,0.35);
      box-shadow:
        0 20px 45px rgba(0,0,0,0.85),
        0 0 0 1px rgba(255,255,255,0.02);
      padding: 15px 14px 18px;
      position: relative;
      overflow: hidden;
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(32px);
      opacity: 0.4;
      pointer-events: none;
    }
    .card::before {
      width: 120px;
      height: 120px;
      background: rgba(250,204,21,0.25);
      top: -40px;
      right: -40px;
    }
    .card::after {
      width: 110px;
      height: 110px;
      background: rgba(45,212,191,0.18);
      bottom: -30px;
      left: -30px;
    }
    .card-inner {
      position: relative;
      z-index: 1;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      display: block;
      margin-top: 12px;
      margin-bottom: 4px;
    }

    textarea,
    select,
    input {
      width: 100%;
      padding: 9px 10px;
      font-size: 0.95rem;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-input);
      color: var(--text-main);
      outline: none;
      -webkit-appearance: none;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    textarea::placeholder {
      color: rgba(156,163,175,0.85);
    }

    select {
      padding-right: 28px;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--gold-strong) 50%),
        linear-gradient(135deg, var(--gold-strong) 50%, transparent 50%);
      background-position:
        calc(100% - 15px) 55%,
        calc(100% - 10px) 55%;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
    }

    .row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .row > * { flex: 1; }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 11px;
      font-size: 0.96rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: transform 0.08s ease-out, box-shadow 0.08s ease-out,
        background 0.12s ease-out, opacity 0.12s ease-out;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .primary {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-strong) 100%);
      color: #222;
      box-shadow:
        0 11px 25px rgba(0,0,0,0.8),
        0 0 0 1px rgba(0,0,0,0.4);
    }
    .primary span.icon {
      margin-right: 4px;
    }
    .primary:active {
      transform: translateY(1px) scale(0.99);
      box-shadow: 0 5px 14px rgba(0,0,0,0.8);
      opacity: 0.92;
    }

    .secondary {
      background: transparent;
      color: var(--gold);
      border: 1px solid rgba(250,204,21,0.65);
    }
    .secondary:active {
      transform: translateY(1px) scale(0.99);
      opacity: 0.9;
    }

    .tabs {
      display: flex;
      border-radius: 999px;
      background: rgba(15,23,42,0.96);
      padding: 3px;
      margin-bottom: 12px;
      margin-top: 2px;
      border: 1px solid rgba(148,163,184,0.5);
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 7px 8px;
      font-size: 0.78rem;
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 500;
      line-height: 1.3;
    }
    .tab-number {
      min-width: 16px;
      height: 16px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      flex-shrink: 0;
    }
    .tab-label {
      /* 折り返しOKにして、②がはみ出さないようにする */
      text-align: left;
    }
    .tab.active {
      background: radial-gradient(circle at top left, #fff8da 0, var(--gold-strong) 55%, #f97316 100%);
      color: #111318;
      font-weight: 700;
      box-shadow: 0 4px 18px rgba(0,0,0,0.85);
    }
    .tab.active .tab-number {
      border-color: transparent;
      background: rgba(15,23,42,0.9);
      color: #fbbf24;
    }

    .section { display: none; }
    .section.active { display: block; }

    .note {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .results {
      margin-top: 18px;
      padding: 12px;
      border-radius: 16px;
      background: radial-gradient(circle at top left, #1f2937, #020617);
      border: 1px solid rgba(148,163,184,0.6);
    }

    .results-header {
      font-size: 0.86rem;
      margin-bottom: 8px;
      color: var(--gold);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .results-header-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .results-header span.icon {
      font-size: 0.98rem;
    }
    .results-badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(30,64,175,0.4);
      border: 1px solid rgba(129,140,248,0.9);
      color: #e5e7eb;
    }

    .team {
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dashed rgba(75,85,99,0.7);
    }
    .team:last-of-type {
      border-bottom: none;
      margin-bottom: 6px;
      padding-bottom: 0;
    }
    .team-title-line {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 2px;
    }
    .team-title {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--gold-soft);
    }
    .team-count {
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .team-members { font-size: 0.9rem; }
    .team-members span.empty {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .line-label {
      margin-top: 10px;
    }

    .footer-note {
      margin-top: 10px;
      font-size: 0.76rem;
      color: var(--text-muted);
      text-align: center;
    }

    @media (min-width: 640px) {
      body { padding: 24px 16px 32px; }
      header { margin-bottom: 20px; }
      h1 { font-size: 1.4rem; }
      .card { padding: 18px 18px 20px; }
      button { font-size: 1rem; }
      .tab { font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>パブスポ専用 チーム分けツール</h1>
      <div class="subtitle">1回目：人数をランダム分配 ／ 2回目以降：前回チームから再分配</div>
    </header>

    <div class="card">
      <div class="card-inner">
        <div class="tabs">
          <div class="tab active" id="tab-first" onclick="switchMode('first')">
            <div class="tab-number">1</div>
            <div class="tab-label">初回（個人リスト→チーム）</div>
          </div>
          <div class="tab" id="tab-next" onclick="switchMode('next')">
            <div class="tab-number">2</div>
            <div class="tab-label">2回目以降（前回チーム→新チーム）</div>
          </div>
        </div>

        <!-- 初回モード -->
        <section id="section-first" class="section active">
          <label for="members-first">メンバー</label>
          <textarea id="members-first" placeholder="1行につき1人ずつ入力してください"></textarea>

          <label for="teamCount-first">チーム数</label>
          <select id="teamCount-first">
            <option value="2">2チーム</option>
            <option value="3">3チーム</option>
            <option value="4">4チーム</option>
            <option value="5">5チーム</option>
            <option value="6">6チーム</option>
          </select>

          <div class="row">
            <div>
              <label for="startLabel-first">チーム番号の開始</label>
              <select id="startLabel-first">
                <option value="number">1, 2, 3...</option>
                <option value="alphabet">A, B, C...</option>
              </select>
            </div>
          </div>

          <button class="primary" onclick="generateTeamsFirst()">
            <span class="icon">🎲</span>ランダムでチーム分けする
          </button>
        </section>

        <!-- 2回目以降モード -->
        <section id="section-next" class="section">
          <label for="members-next">前回のチーム結果を貼り付け</label>
          <textarea id="members-next" placeholder="このツールが出した「LINE投稿用テキスト」か、同じ形式のテキストを貼り付けてください。"></textarea>

          <label for="teamCount-next">今回のチーム数</label>
          <select id="teamCount-next">
            <option value="2">2チーム</option>
            <option value="3">3チーム</option>
            <option value="4">4チーム</option>
            <option value="5">5チーム</option>
            <option value="6">6チーム</option>
          </select>

          <div class="row">
            <div>
              <label for="startLabel-next">チーム番号の開始</label>
              <select id="startLabel-next">
                <option value="number">1, 2, 3...</option>
                <option value="alphabet">A, B, C...</option>
              </select>
            </div>
          </div>

          <div class="note">
            ロジック：前回の各チームごとのメンバーを、今回のチーム数に応じて<br>
            できるだけバラけるように順番に振り分けます（同じ顔ぶれを減らすイメージ）。
          </div>

          <button class="primary" onclick="generateTeamsFromPrevious()">
            <span class="icon">🔁</span>前回のチームから再分配する
          </button>
        </section>

        <section id="resultsSection" class="results" style="display:none;">
          <div class="results-header">
            <div class="results-header-left">
              <span class="icon">🏅</span>
              <span>チーム分け結果</span>
            </div>
            <div class="results-badge" id="summaryBadge"></div>
          </div>
          <div id="results"></div>

          <label class="line-label" for="lineText">LINE投稿用テキスト</label>
          <textarea id="lineText" readonly></textarea>
          <button class="secondary" onclick="copyLineText()">LINE用テキストをコピー</button>
        </section>

        <div class="footer-note">
          Powered by Pubspo team / GitHub Pages
        </div>
      </div>
    </div>
  </div>

  <script>
    function switchMode(mode) {
      const tabFirst = document.getElementById('tab-first');
      const tabNext = document.getElementById('tab-next');
      const sectionFirst = document.getElementById('section-first');
      const sectionNext = document.getElementById('section-next');

      if (mode === 'first') {
        tabFirst.classList.add('active');
        tabNext.classList.remove('active');
        sectionFirst.classList.add('active');
        sectionNext.classList.remove('active');
      } else {
        tabFirst.classList.remove('active');
        tabNext.classList.add('active');
        sectionFirst.classList.remove('active');
        sectionNext.classList.add('active');
      }
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function buildOutput(teams, startLabel) {
      const resultsDiv = document.getElementById('results');
      const summaryBadge = document.getElementById('summaryBadge');
      resultsDiv.innerHTML = '';

      const totalMembers = teams.reduce((sum, t) => sum + t.length, 0);
      const nonEmptyTeams = teams.filter(t => t.length > 0).length;
      summaryBadge.textContent =
        `${totalMembers}人 / ${teams.length}チーム（うち${nonEmptyTeams}チームにメンバーあり）`;

      let lineText = '【パブスポ チーム分け結果】\n\n';

      for (let i = 0; i < teams.length; i++) {
        let label;
        if (startLabel === 'alphabet') {
          label = String.fromCharCode('A'.charCodeAt(0) + i);
        } else {
          label = (i + 1).toString();
        }
        const teamName = 'チーム' + label;
        const count = teams[i].length;

        const teamDiv = document.createElement('div');
        teamDiv.className = 'team';

        const titleLine = document.createElement('div');
        titleLine.className = 'team-title-line';

        const title = document.createElement('div');
        title.className = 'team-title';
        title.textContent = '【' + teamName + '】';

        const countSpan = document.createElement('div');
        countSpan.className = 'team-count';
        countSpan.textContent = count + '人';

        titleLine.appendChild(title);
        titleLine.appendChild(countSpan);
        teamDiv.appendChild(titleLine);

        const list = document.createElement('div');
        if (count > 0) {
          list.className = 'team-members';
          list.innerHTML = teams[i].join('<br>');
        } else {
          list.className = 'team-members';
          list.innerHTML = '<span class="empty">（メンバーなし）</span>';
        }
        teamDiv.appendChild(list);

        resultsDiv.appendChild(teamDiv);

        lineText += '【' + teamName + '】\n';
        if (count > 0) {
          lineText += teams[i].join('\n');
        } else {
          lineText += '（メンバーなし）';
        }
        lineText += '\n\n';
      }

      document.getElementById('lineText').value = lineText.trimEnd();
      document.getElementById('resultsSection').style.display = 'block';
    }

    // ① 初回：個人リストからランダムで分配
    function generateTeamsFirst() {
      const membersText = document.getElementById('members-first').value;
      const teamCount = parseInt(document.getElementById('teamCount-first').value, 10);
      const startLabel = document.getElementById('startLabel-first').value;

      const members = membersText
        .split(/\r?\n/)
        .map(m => m.trim())
        .filter(m => m.length > 0);

      if (members.length === 0) {
        alert('メンバーを1人以上入力してください。');
        return;
      }
      if (!Number.isInteger(teamCount) || teamCount <= 0) {
        alert('チーム数が正しくありません。');
        return;
      }
      if (teamCount > members.length) {
        if (!confirm('メンバー数よりチーム数の方が多いです。それでも続けますか？')) {
          return;
        }
      }

      shuffle(members);

      const teams = Array.from({ length: teamCount }, () => []);
      for (let i = 0; i < members.length; i++) {
        const teamIndex = i % teamCount;
        teams[teamIndex].push(members[i]);
      }

      buildOutput(teams, startLabel);
    }

    // ② 2回目以降：前回チームごとにメンバーを分配
    function parsePreviousTeams(text) {
      const lines = text.split(/\r?\n/);
      const teams = [];
      let currentTeam = null;

      for (let raw of lines) {
        const line = raw.trim();
        if (line.length === 0) continue;

        const match = line.match(/^【(.+?)】/);
        if (match) {
          if (currentTeam !== null) {
            teams.push(currentTeam.members);
          }
          currentTeam = { name: match[1], members: [] };
          continue;
        }

        if (line === '（メンバーなし）') {
          continue;
        } else {
          if (currentTeam === null) {
            currentTeam = { name: 'チーム', members: [] };
          }
          currentTeam.members.push(line);
        }
      }

      if (currentTeam !== null) {
        teams.push(currentTeam.members);
      }

      return teams;
    }

    function generateTeamsFromPrevious() {
      const text = document.getElementById('members-next').value;
      const teamCount = parseInt(document.getElementById('teamCount-next').value, 10);
      const startLabel = document.getElementById('startLabel-next').value;

      if (!text.trim()) {
        alert('前回のチーム結果を貼り付けてください。');
        return;
      }
      if (!Number.isInteger(teamCount) || teamCount <= 0) {
        alert('チーム数が正しくありません。');
        return;
      }

      const previousTeams = parsePreviousTeams(text);
      const allMembers = previousTeams.flat();

      if (allMembers.length === 0) {
        alert('メンバーが読み取れませんでした。形式を確認してください。');
        return;
      }
      if (teamCount > allMembers.length) {
        if (!confirm('メンバー数よりチーム数の方が多いです。それでも続けますか？')) {
          return;
        }
      }

      const teams = Array.from({ length: teamCount }, () => []);

      for (let t = 0; t < previousTeams.length; t++) {
        const members = previousTeams[t].slice();
        shuffle(members);
        for (let i = 0; i < members.length; i++) {
          const teamIndex = (t + i) % teamCount;
          teams[teamIndex].push(members[i]);
        }
      }

      buildOutput(teams, startLabel);
    }

    function copyLineText() {
      const textArea = document.getElementById('lineText');
      textArea.select();
      textArea.setSelectionRange(0, 99999);

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textArea.value)
          .then(() => alert('LINE用テキストをコピーしました。'))
          .catch(() => {
            document.execCommand('copy');
            alert('LINE用テキストをコピーしました。');
          });
      } else {
        document.execCommand('copy');
        alert('LINE用テキストをコピーしました。');
      }
    }
  </script>
</body>
</html>
